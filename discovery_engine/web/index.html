<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Engine</title>
<meta name="description" content="Evidence workspace for discovering why users can't retrieve photos they vaguely remember.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><circle cx='14' cy='14' r='6' fill='none' stroke='white' stroke-width='3'/><path d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<script>
  try { const t = localStorage.getItem("de-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">Discovery Engine</div>
        <div class="brand-sub">Vaguely remembered photos</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <button class="ask-trigger" id="askTrigger" aria-label="Ask the evidence (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Ask the evidence…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="topbar-actions">
        <span id="provenancePill"></span>
        <button class="btn ghost" id="rebuildBtn" title="Recompute every number from current analyses and PM corrections">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hide-sm">Rebuild</span>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Evidence inspector" aria-hidden="true"></aside>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Ask the evidence">
  <div class="palette-box">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="paletteInput" placeholder="Ask a discovery question, e.g. what do users forget?" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
